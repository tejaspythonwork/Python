<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policies Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Reset and global styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #34495e;
        }

        .links-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .dashboard-link {
            display: inline-block;
            text-decoration: none;
            background-color: #2980b9;
            color: #fff;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        .dashboard-link:hover {
            background-color: #1f6a96;
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                width: 90%;
            }

            .dashboard-link {
                font-size: 16px;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Policies Dashboard</h2>

        <!-- Links Section -->
        <div class="links-section">
            <a href="{% url 'createpolicy' %}" class="dashboard-link">Add Policies</a>
            <a href="{% url 'request_policy'%}" class="dashboard-link">Request Policies</a>
            <a href="{% url 'policyoperations' %}" class="dashboard-link">Policies Operation</a>
        </div>

        <footer>
            &copy; 2024 Your Company | Manage Policies with Ease
        </footer>
    </div>
</body>
</html>
