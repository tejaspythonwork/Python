<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Holder Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 50%;
            max-width: 500px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .link-button {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        .link-button:hover {
            background-color: #2980b9;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                width: 90%;
            }

            .link-button {
                font-size: 16px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Policy Holder Dashboard</h2>
    
    <!-- Ask Question Link -->
    <a href="/ask-question/" class="link-button">Ask a Question</a>
    
    <!-- List of Questions Link -->
    <a href="/my-questions/" class="link-button">List of Questions</a>
</div>

</body>
</html>
