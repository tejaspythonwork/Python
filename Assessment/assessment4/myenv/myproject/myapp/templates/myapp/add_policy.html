<html>
    <head></head>
{% comment %} {% extends 'index.html' %} {% endcomment %}

{% comment %} {% block title %}Add New Policy{% endblock %} {% endcomment %}

{% comment %} {% block content %} {% endcomment %}
<body>
<h2>Create a New Policy</h2>

<form method="POST" action="">
    {% csrf_token %}
    
    <!-- Policy Number -->
    <label for="policy_number">Policy Number:</label>
    <input type="text" id="policy_number" name="policy_number" maxlength="20" required>
    <br>
    
    <!-- Policy Name -->
    <label for="policy_name">Policy Name:</label>
    <input type="text" id="policy_name" name="policy_name" maxlength="100" required>
    <br>
    
    <!-- Description -->
    <label for="description">Description:</label>
    <textarea id="description" name="description" rows="4" required></textarea>
    <br>
    
    <!-- Premium Amount -->
    <label for="premium_amount">Premium Amount:</label>
    <input type="number" id="premium_amount" name="premium_amount" step="0.01" required>
    <br>
    
    {% comment %} <!-- Is Approved Checkbox -->
    <label for="is_approved">Is Approved:</label>
    <input type="checkbox" id="is_approved" name="is_approved">
    <br>
     
    {% endcomment %}
    <!-- Submit Button -->
    <input type="submit" value="Create Policy">
</form>
</body>
    </html>
